# tmux config.
# Intentionally plugin-free: tpm + theme plugins made startup take ~30s with
# the snap tmux (every plugin script shells out to tmux many times).

# --- general (from home-manager programs.tmux + tmux-sensible) -------------
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g display-time 2000
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on
setw -g aggressive-resize on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Clipboard (OSC 52 -> works in ghostty), passthrough, extended keys, links
set -s set-clipboard on
set -g allow-passthrough all
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -as terminal-features ",*:hyperlinks"

# --- keys -------------------------------------------------------------------
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind f new-window tmux-sessionizer

# vim-tmux-navigator (inline instead of the plugin; pairs with the nvim plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# --- berserk theme ------------------------------------------------------------
set -g status-left-length 100
set -g status-right-length 100
setw -g window-status-activity-style "italics"
setw -g window-status-bell-style "bold"
set -g message-style "bg=#e6e6e6,fg=#0a0a0a"
set -g status-style "bg=#303030,fg=#e6e6e6"
set -g pane-active-border-style "fg=#e6e6e6"
set -g pane-border-style "fg=#e6e6e6"
set -g status-left "#[fg=#8B0000,bold]#{?client_prefix,#[bg=#0a0a0a],#[bg=#e6e6e6]}  #S #[bg=#303030]#{?client_prefix,#[fg=#0a0a0a],#[fg=#e6e6e6]}#[none]"
setw -g window-status-format "#[bg=#8B0000,fg=#303030]#[none]#[fg=#e6e6e6]#I#[bg=#1a1a1a,fg=#8B0000]#[none]#[fg=#8B0000] #{?window_zoomed_flag, , }#W #[bg=#303030,fg=#1a1a1a]#[none]"
setw -g window-status-current-format "#[bg=#8B0000,fg=#303030]#[none]#[fg=#e6e6e6]#I#[bg=#e6e6e6,fg=#8B0000]#[none]#[fg=#8B0000] #{?window_zoomed_flag, , }#W #[bg=#303030,fg=#e6e6e6]#[none]"
setw -g window-status-separator ""
set -g status-right "#[fg=#1a1a1a,bg=#303030]#[none]#[fg=#8B0000,bg=#1a1a1a]  #[fg=#8B0000,bg=#1a1a1a]#[none]#[fg=#e6e6e6,bg=#8B0000] %R %A #[none]#[fg=#4A0000,bg=#8B0000]#[none]#[fg=#e6e6e6,bg=#4A0000] %d %b %Y#[none] "
