# Launcher (Super+D) and clipboard picker (Super+Shift+V) - Berserk palette
[main]
font=JetBrainsMono Nerd Font:size=13
prompt="  "
icon-theme=Yaru-red-dark
icons-enabled=yes
terminal=ghostty -e
layer=overlay
width=42
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=26
letter-spacing=0
tabs=4
show-actions=no

[colors]
background=141414f5
text=c5c9c5ff
match=d14b4bff
selection=4a0000ff
selection-text=ffffffff
selection-match=ff8080ff
border=8b0000ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes
