# default left prompt (dir, git, languages, duration); user@host + time on the right
right_format = "$username$hostname$time"

[character]
success_symbol = "[λ](bold green)"
error_symbol = "[λ](bold red)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
disabled = false

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold cyan"
disabled = false

[time]
disabled = false
style = "cyan"
format = "[ $time]($style) "
time_format = "%T"
