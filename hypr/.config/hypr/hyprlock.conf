# Lock screen - Berserk palette, same wallpaper as hyprpaper, blurred.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    # /etc/pam.d/hyprlock is installed by scripts/update-desktop.sh
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    path = ~/.config/hypr/berserk.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.1
}

# time
label {
    text = $TIME
    color = rgba(e6e6e6ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

# date
label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(bdbdbdff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 2
    rounding = 10
    outer_color = rgba(8b0000ff)
    inner_color = rgba(141414e6)
    font_color = rgba(e6e6e6ff)
    check_color = rgba(e8c475ff)
    fail_color = rgba(f15c50ff)
    capslock_color = rgba(e8c475ff)
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <span foreground="##8b8b8b">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
