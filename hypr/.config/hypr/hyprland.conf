# Hyprland config.
# Docs: https://wiki.hypr.land/Configuring/

# highrr: use the highest refresh rate (the AOC panel does 144Hz, preferred picked 60Hz)
monitor = ,highrr,auto,1

$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = fuzzel

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = [workspace 1 silent] ghostty
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 4 silent] obsidian
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# start-hyprland doesn't source the login shell, so ~/.local/bin (hyprshot,
# waybar 0.15, ghostty, hyprpaper wrapper) would be missing from PATH.
env = PATH,/home/max/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,theme_dragon-slayer

# NVIDIA (RTX 2060, proprietary driver)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Native Wayland for toolkits
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(8B0000ff)
    col.inactive_border = rgba(2a2a2aaa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global,1,10,default
    animation = border,1,5.39,easeOutQuint
    animation = windows,1,4.79,easeOutQuint
    animation = windowsIn,1,4.1,easeOutQuint,popin 87%
    animation = windowsOut,1,1.49,linear,popin 87%
    animation = fadeIn,1,1.73,almostLinear
    animation = fadeOut,1,1.46,almostLinear
    animation = fade,1,3.03,quick
    animation = layers,1,3.81,easeOutQuint
    animation = layersIn,1,4,easeOutQuint,fade
    animation = layersOut,1,1.5,linear,fade
    animation = fadeLayersIn,1,1.79,almostLinear
    animation = fadeLayersOut,1,1.39,almostLinear
    animation = workspaces,1,1.94,almostLinear,fade
    animation = workspacesIn,1,1.21,almostLinear,fade
    animation = workspacesOut,1,1.94,almostLinear,fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# Hyprbars titlebar plugin. Built from hyprwm/hyprland-plugins for this Hyprland version.
plugin = /home/max/.local/lib/hyprland-plugins/hyprbars.so

plugin {
    hyprbars {
        enabled = true
        bar_height = 24
        bar_color = rgba(1a1a1aee)
        col.text = rgba(e6e6e6ff)
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_align = center
        bar_buttons_alignment = right
        bar_padding = 8
        bar_button_padding = 6
        bar_blur = true
        bar_part_of_window = true
        hyprbars-button = rgb(8b0000), 12, 󰖭, hyprctl dispatch killactive, rgb(e6e6e6)
        hyprbars-button = rgb(2a2a2a), 12, , hyprctl dispatch fullscreen 1, rgb(e6e6e6)
        on_double_click = hyprctl dispatch fullscreen 1
    }
}

windowrule = workspace 3, match:class ^(matplotlib)$
windowrule = workspace 3, match:class ^(Figure.*)
windowrule = workspace 3, match:class ^(python.*)
windowrule = workspace 3, match:title ^(Figure.*)
windowrule = workspace 3, match:title .*matplotlib.*
windowrule = workspace 3, match:title .*pyplot.*
windowrule = workspace 3, match:class ^(Tk)$
windowrule = workspace 3, match:class ^(tk)$
windowrule = workspace 3, match:class ^(tkinter)$
windowrule = workspace 3, match:class ^(python.*qt.*)
windowrule = workspace 3, match:class ^(Python)$
windowrule = suppress_event fullscreen maximize, match:class ^(neuz\.exe)$

# Float small tool windows and dialogs instead of tiling them half-screen
windowrule = float on, match:class ^(com\.saivert\.pwvucontrol|pwvucontrol|pavucontrol)$
windowrule = size 1000 650, match:class ^(com\.saivert\.pwvucontrol|pwvucontrol|pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor|blueman-manager|org\.gnome\.Calculator)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk|polkit-mate-authentication-agent-1)$
windowrule = float on, match:title ^(Open File|Open Files|Save File|Save As|Open Folder|Select a File|Choose Files|File Upload|File Operation Progress|Confirm to replace files)(.*)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(firefox.*)$, match:title ^(Library)$
windowrule = center on, match:float 1

# blur behind the launcher and notifications
layerrule = blur on, match:namespace ^(launcher|notifications)$

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
# Shift added so a stray Super+M can't kill the whole session
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, D, exec, $menu
# clipboard history (cliphist) picked with fuzzel
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu --prompt '󰅌  ' | cliphist decode | wl-copy

bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, l, movefocus, r
bind = $mainMod, h, movefocus, l
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod CTRL, k, resizeactive, 0 -20
bind = $mainMod CTRL, j, resizeactive, 0 20
bind = $mainMod CTRL, l, resizeactive, 20 0
bind = $mainMod CTRL, h, resizeactive, -20 0
bind = $mainMod ALT, k, moveactive, 0 -20
bind = $mainMod ALT, j, moveactive, 0 20
bind = $mainMod ALT, l, moveactive, 20 0
bind = $mainMod ALT, h, moveactive, -20 0
# screenshots: region -> clipboard, region / whole monitor -> ~/Pictures/Screenshots
bind = $mainMod SHIFT, s, exec, hyprshot -m region --clipboard-only
bind = $mainMod CTRL, s, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = , Print, exec, hyprshot -m output -m active -o ~/Pictures/Screenshots

bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# lock now (hypridle runs hyprlock via loginctl lock-session)
bind = $mainMod SHIFT, L, exec, loginctl lock-session

# scratchpad: Super+S toggles it, Super+Alt+S sends the window there
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# media / volume / brightness keys (l = also while locked, e = repeat)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow
