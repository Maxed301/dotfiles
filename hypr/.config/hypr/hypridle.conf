# Idle handling (started from hyprland.conf). Lock on Super+Shift+L.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # only one hyprlock, even if lock-session fires twice
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: monitor off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
